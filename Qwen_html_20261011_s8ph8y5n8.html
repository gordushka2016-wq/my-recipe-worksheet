<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How We Made - Recipe Worksheet</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .toolbar {
            position: sticky;
            top: 10px;
            z-index: 100;
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .toolbar button {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-family: 'Nunito', sans-serif;
            font-size: 1em;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-pdf {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
        }
        .btn-pdf:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(238,90,36,0.4); }

        .btn-jpeg {
            background: linear-gradient(135deg, #48dbfb, #0abde3);
            color: white;
        }
        .btn-jpeg:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(10,189,227,0.4); }

        .btn-print {
            background: linear-gradient(135deg, #54a0ff, #2e86de);
            color: white;
        }
        .btn-print:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(46,134,222,0.4); }

        .worksheet {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 25px;
            padding: 35px 40px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
            border: 4px dashed #ff6b6b;
            position: relative;
            overflow: hidden;
        }

        .worksheet::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 8px;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #54a0ff, #5f27cd);
        }

        .title-section {
            text-align: center;
            margin-bottom: 10px;
        }

        .title-swirl {
            font-size: 2em;
            color: #ff6b6b;
        }

        .title-text {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5em;
            background: linear-gradient(135deg, #ff6b6b, #feca57, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            display: inline-block;
            margin: 0 10px;
        }

        .recipe-name-line {
            width: 60%;
            margin: 10px auto 25px;
            border: none;
            border-bottom: 3px solid #48dbfb;
            background: transparent;
            font-family: 'Fredoka One', cursive;
            font-size: 1.3em;
            text-align: center;
            color: #5f27cd;
            outline: none;
            padding: 5px;
            display: block;
        }

        .recipe-name-line::placeholder {
            color: #b2bec3;
            font-family: 'Nunito', sans-serif;
            font-size: 0.7em;
        }

        .section-title {
            font-family: 'Fredoka One', cursive;
            font-size: 1.5em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ingredients-title { color: #e17055; }
        .steps-title { color: #6c5ce7; margin-top: 30px; }

        .ingredients-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 10px;
        }

        .ingredient-box { position: relative; }

        .ingredient-img-box {
            width: 100%;
            height: 110px;
            border: 3px solid #ffeaa7;
            border-radius: 15px;
            background: linear-gradient(135deg, #fff9e6, #fff3cd);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .ingredient-img-box:hover {
            border-color: #feca57;
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(254, 202, 87, 0.3);
        }

        .ingredient-img-box .emoji-placeholder {
            font-size: 2.5em;
            opacity: 0.3;
        }

        .ingredient-img-box input[type="file"] { display: none; }

        .ingredient-label {
            width: 100%;
            border: none;
            border-bottom: 3px solid #ffeaa7;
            background: transparent;
            font-family: 'Nunito', sans-serif;
            font-size: 1em;
            font-weight: 700;
            text-align: center;
            color: #e17055;
            outline: none;
            padding: 8px 5px;
            margin-top: 5px;
        }

        .ingredient-label::placeholder { color: #ddd; }
        .ingredient-label:focus { border-bottom-color: #feca57; }

        .steps-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .step-row {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .step-text { flex: 1; }

        .step-number {
            font-family: 'Fredoka One', cursive;
            font-size: 1.4em;
            display: inline-block;
            width: 40px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            border-radius: 50%;
            color: white;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .step-1 .step-number { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
        .step-2 .step-number { background: linear-gradient(135deg, #feca57, #f39c12); }
        .step-3 .step-number { background: linear-gradient(135deg, #48dbfb, #0abde3); }
        .step-4 .step-number { background: linear-gradient(135deg, #ff9ff3, #f368e0); }

        .step-lines {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 5px;
        }

        .step-line {
            width: 100%;
            border: none;
            border-bottom: 2.5px solid #dfe6e9;
            background: transparent;
            font-family: 'Nunito', sans-serif;
            font-size: 1em;
            color: #2d3436;
            outline: none;
            padding: 5px 5px 5px 50px;
            transition: border-color 0.3s;
        }

        .step-line:focus { border-bottom-color: #6c5ce7; }
        .step-line::placeholder { color: #dfe6e9; }

        .step-img-box {
            width: 120px;
            height: 100px;
            border: 3px solid #dfe6e9;
            border-radius: 15px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .step-img-box:hover {
            border-color: #6c5ce7;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.2);
        }

        .step-img-box .emoji-placeholder { font-size: 2em; opacity: 0.3; }
        .step-img-box input[type="file"] { display: none; }

        .decorative-emojis {
            position: absolute;
            font-size: 1.5em;
            opacity: 0.15;
            pointer-events: none;
        }

        .emoji-tl { top: 20px; left: 15px; }
        .emoji-tr { top: 20px; right: 15px; }
        .emoji-bl { bottom: 20px; left: 15px; }
        .emoji-br { bottom: 20px; right: 15px; }

        .fun-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 3px dashed #ffeaa7;
            font-size: 1.5em;
            letter-spacing: 5px;
        }

        .status-msg {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: none;
            z-index: 200;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 600px) {
            .worksheet { padding: 20px; }
            .title-text { font-size: 1.8em; }
            .ingredients-grid { grid-template-columns: repeat(2, 1fr); }
            .step-row { flex-direction: column; }
            .step-img-box { width: 100%; height: 80px; }
        }

        @media print {
            body { background: white; padding: 0; }
            .toolbar, .status-msg { display: none !important; }
            .worksheet { box-shadow: none; border: 3px dashed #ff6b6b; }
            .ingredient-img-box, .step-img-box { border: 2px solid #ddd; }
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="btn-pdf" onclick="downloadPDF()"> Download PDF</button>
        <button class="btn-jpeg" onclick="downloadJPEG()">️ Download JPEG</button>
        <button class="btn-print" onclick="window.print()">️ Print</button>
    </div>

    <div class="worksheet" id="worksheet">
        <span class="decorative-emojis emoji-tl"></span>
        <span class="decorative-emojis emoji-tr">🧁</span>
        <span class="decorative-emojis emoji-bl">🥗</span>
        <span class="decorative-emojis emoji-br"></span>

        <div class="title-section">
            <span class="title-swirl">✿</span>
            <span class="title-text">HOW WE MADE</span>
            <span class="title-swirl">✿</span>
        </div>

        <input type="text" class="recipe-name-line" placeholder="Write the name of your dish here...">

        <div class="section-title ingredients-title">🥕 Ingredients:</div>

        <div class="ingredients-grid">
            <div class="ingredient-box">
                <div class="ingredient-img-box" onclick="this.querySelector('input').click()">
                    <span class="emoji-placeholder"></span>
                    <input type="file" accept="image/*" onchange="previewImage(this)">
                </div>
                <input type="text" class="ingredient-label" placeholder="ingredient...">
            </div>
            <div class="ingredient-box">
                <div class="ingredient-img-box" onclick="this.querySelector('input').click()">
                    <span class="emoji-placeholder"></span>
                    <input type="file" accept="image/*" onchange="previewImage(this)">
                </div>
                <input type="text" class="ingredient-label" placeholder="ingredient...">
            </div>
            <div class="ingredient-box">
                <div class="ingredient-img-box" onclick="this.querySelector('input').click()">
                    <span class="emoji-placeholder"></span>
                    <input type="file" accept="image/*" onchange="previewImage(this)">
                </div>
                <input type="text" class="ingredient-label" placeholder="ingredient...">
            </div>
            <div class="ingredient-box">
                <div class="ingredient-img-box" onclick="this.querySelector('input').click()">
                    <span class="emoji-placeholder"></span>
                    <input type="file" accept="image/*" onchange="previewImage(this)">
                </div>
                <input type="text" class="ingredient-label" placeholder="ingredient...">
            </div>
            <div class="ingredient-box">
                <div class="ingredient-img-box" onclick="this.querySelector('input').click()">
                    <span class="emoji-placeholder"></span>
                    <input type="file" accept="image/*" onchange="previewImage(this)">
                </div>
                <input type="text" class="ingredient-label" placeholder="ingredient...">
            </div>
            <div class="ingredient-box">
                <div class="ingredient-img-box" onclick="this.querySelector('input').click()">
                    <span class="emoji-placeholder"></span>
......
                </div>
                <input type="text" class="ingredient-label" placeholder="ingredient...">
            </div>
        </div>

        <div class="section-title steps-title">Step-by-step instructions:</div>

        <div class="steps-container">
            <div class="step-row step-1">
                <div class="step-text">
                    <span class="step-number">1.</span>
                    <div class="step-lines">
                        <input type="text" class="step-line" placeholder="First, we...">
                        <input type="text" class="step-line" placeholder="">
                    </div>
                </div>
                <div class="step-img-box" onclick="this.querySelector('input').click()">
                    <span class="emoji-placeholder"></span>
                    <input type="file" accept="image/*" onchange="previewImage(this)">
                </div>
            </div>

            <div class="step-row step-2">
                <div class="step-text">
                    <span class="step-number">2.</span>
                    <div class="step-lines">
                        <input type="text" class="step-line" placeholder="Then, we...">
                        <input type="text" class="step-line" placeholder="">
                    </div>
                </div>
                <div class="step-img-box" onclick="this.querySelector('input').click()">
                    <span class="emoji-placeholder"></span>
                    <input type="file" accept="image/*" onchange="previewImage(this)">
                </div>
            </div>

            <div class="step-row step-3">
                <div class="step-text">
                    <span class="step-number">3.</span>
                    <div class="step-lines">
                        <input type="text" class="step-line" placeholder="After that, we...">
                        <input type="text" class="step-line" placeholder="">
                    </div>
                </div>
                <div class="step-img-box" onclick="this.querySelector('input').click()">
                    <span class="emoji-placeholder"></span>
                    <input type="file" accept="image/*" onchange="previewImage(this)">
                </div>
            </div>

            <div class="step-row step-4">
                <div class="step-text">
                    <span class="step-number">4.</span>
                    <div class="step-lines">
                        <input type="text" class="step-line" placeholder="Finally, we...">
                        <input type="text" class="step-line" placeholder="">
                    </div>
                </div>
                <div class="step-img-box" onclick="this.querySelector('input').click()">
                    <span class="emoji-placeholder"></span>
                    <input type="file" accept="image/*" onchange="previewImage(this)">
                </div>
            </div>
        </div>

        <div class="fun-footer">️ 🥘 👨‍ 🍰</div>
    </div>

    <div class="status-msg" id="statusMsg"></div>

    <script>
        // Preview uploaded images
        function previewImage(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const box = input.parentElement;
                    box.innerHTML = `<img src="${event.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:12px;">`;
                    box.appendChild(input);
                };
                reader.readAsDataURL(file);
            }
        }

        // Show status message
        function showStatus(msg) {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        // Download as PDF
        async function downloadPDF() {
            showStatus(' Generating PDF...');
            const element = document.getElementById('worksheet');
            
            try {
                const canvas = await html2canvas(element, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#ffffff',
                    logging: false
                });

                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                
                // A4 dimensions in mm
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();
                
                const imgWidth = canvas.width;
                const imgHeight = canvas.height;
                const ratio = Math.min(pdfWidth / imgWidth, pdfHeight / imgHeight);
                
                const imgX = (pdfWidth - imgWidth * ratio) / 2;
                const imgY = 10;
                
                pdf.addImage(imgData, 'PNG', imgX, imgY, imgWidth * ratio, imgHeight * ratio);
                pdf.save('recipe-worksheet.pdf');
                showStatus('✅ PDF downloaded!');
            } catch (err) {
                console.error(err);
                showStatus('❌ Error generating PDF');
            }
        }

        // Download as JPEG
        async function downloadJPEG() {
            showStatus('⏳ Generating JPEG...');
            const element = document.getElementById('worksheet');
            
            try {
                const canvas = await html2canvas(element, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#ffffff',
                    logging: false
                });

                const link = document.createElement('a');
                link.download = 'recipe-worksheet.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();
                showStatus('✅ JPEG downloaded!');
            } catch (err) {
                console.error(err);
                showStatus('❌ Error generating JPEG');
            }
        }
    </script>
</body>
</html>
